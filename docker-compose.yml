version: '3.9'

services:
  redis:
    image: redis:8.10-alpine
    container_name: parapente-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - /home/capic/docker-data/dashboard-parapente/redis:/data
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - parapente-network

  backend:
    image: ${CI_BACKEND_IMAGE:-ghcr.io/capic2/dashboard-parapente/backend:main}
    container_name: parapente-backend
    restart: unless-stopped
    ports:
      - '8001:8001'
    labels:
      project: dashboard-parapente
      service: backend
      env: ${ENVIRONMENT:-production}
    environment:
      # Global
      - ENVIRONMENT=${ENVIRONMENT:-production}

      # Backend - Database
      - BACKEND_DATABASE_URL=${BACKEND_DATABASE_URL:?BACKEND_DATABASE_URL is required}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}

      # Backend - Redis
      - BACKEND_REDIS_HOST=redis
      - BACKEND_REDIS_PORT=6379
      - BACKEND_USE_FAKE_REDIS=${BACKEND_USE_FAKE_REDIS:-false}
      - BACKEND_JOB_QUEUE_BACKEND=${BACKEND_JOB_QUEUE_BACKEND:-rq}
      - BACKEND_JOB_QUEUE_NAME=${BACKEND_JOB_QUEUE_NAME:-video_exports}
      - BACKEND_YOUTUBE_UPLOAD_QUEUE_NAME=${BACKEND_YOUTUBE_UPLOAD_QUEUE_NAME:-youtube_uploads}
      - BACKEND_GOPRO_OVERLAY_QUEUE_NAME=${BACKEND_GOPRO_OVERLAY_QUEUE_NAME:-gopro_overlays}
      - BACKEND_GOPRO_PREVIEW_QUEUE_NAME=${BACKEND_GOPRO_PREVIEW_QUEUE_NAME:-gopro_previews}

      # Backend - API
      - BACKEND_API_HOST=${BACKEND_API_HOST:-0.0.0.0}
      - BACKEND_API_PORT=${BACKEND_API_PORT:-8001}
      - BACKEND_API_DEBUG=${BACKEND_API_DEBUG:-false}
      - BACKEND_DEPLOY_DRAIN_TOKEN=${BACKEND_DEPLOY_DRAIN_TOKEN:-}
      - BACKEND_DEPLOY_DRAIN_LEASE_SECONDS=${BACKEND_DEPLOY_DRAIN_LEASE_SECONDS:-4500}

      # Backend - Weather API Keys (set in Portainer)
      - BACKEND_WEATHERAPI_KEY=${BACKEND_WEATHERAPI_KEY}
      - BACKEND_METEOBLUE_API_KEY=${BACKEND_METEOBLUE_API_KEY}
      - BACKEND_SPOTAIR_BALISES_API_KEY=${BACKEND_SPOTAIR_BALISES_API_KEY}

      # Backend - AI Analysis
      - BACKEND_LLM_FALLBACK_ORDER=${BACKEND_LLM_FALLBACK_ORDER:-groq,openrouter,github_models,huggingface,google,custom_openai,codex}
      - BACKEND_LLM_QUOTA_COOLDOWN_SECONDS=${BACKEND_LLM_QUOTA_COOLDOWN_SECONDS:-3600}
      - BACKEND_EMAGRAM_FAILURE_RETRY_MINUTES=${BACKEND_EMAGRAM_FAILURE_RETRY_MINUTES:-360}
      - BACKEND_GOOGLE_API_KEY=${BACKEND_GOOGLE_API_KEY}
      - BACKEND_GEMINI_MODEL=${BACKEND_GEMINI_MODEL:-gemini-2.5-flash}
      - BACKEND_GROQ_API_KEY=${BACKEND_GROQ_API_KEY}
      - BACKEND_GROQ_MODEL=${BACKEND_GROQ_MODEL:-meta-llama/llama-4-scout-17b-16e-instruct}
      - BACKEND_OPENROUTER_API_KEY=${BACKEND_OPENROUTER_API_KEY}
      - BACKEND_OPENROUTER_MODEL=${BACKEND_OPENROUTER_MODEL:-openrouter/free}
      - BACKEND_OPENROUTER_MODELS=${BACKEND_OPENROUTER_MODELS:-openrouter/free}
      - BACKEND_GITHUB_MODELS_API_KEY=${BACKEND_GITHUB_MODELS_API_KEY}
      - BACKEND_GITHUB_MODELS_BASE_URL=${BACKEND_GITHUB_MODELS_BASE_URL:-https://models.github.ai/inference/v1/chat/completions}
      - BACKEND_GITHUB_MODELS_MODELS=${BACKEND_GITHUB_MODELS_MODELS:-openai/gpt-4o-mini}
      - BACKEND_HUGGINGFACE_API_KEY=${BACKEND_HUGGINGFACE_API_KEY}
      - BACKEND_HUGGINGFACE_BASE_URL=${BACKEND_HUGGINGFACE_BASE_URL:-https://router.huggingface.co/v1/chat/completions}
      - BACKEND_HUGGINGFACE_MODELS=${BACKEND_HUGGINGFACE_MODELS:-Qwen/Qwen2.5-VL-7B-Instruct}
      - BACKEND_CUSTOM_OPENAI_API_KEY=${BACKEND_CUSTOM_OPENAI_API_KEY}
      - BACKEND_CUSTOM_OPENAI_BASE_URL=${BACKEND_CUSTOM_OPENAI_BASE_URL}
      - BACKEND_CUSTOM_OPENAI_MODELS=${BACKEND_CUSTOM_OPENAI_MODELS}
      - BACKEND_CODEX_MODEL=${BACKEND_CODEX_MODEL:-}
      - BACKEND_CODEX_TIMEOUT_SECONDS=${BACKEND_CODEX_TIMEOUT_SECONDS:-180}
      - CODEX_HOME=/app/codex-home

      # Backend - Intervals.icu personal activity sync (set API key in Portainer)
      - BACKEND_INTERVALS_ICU_API_KEY=${BACKEND_INTERVALS_ICU_API_KEY}
      - BACKEND_INTERVALS_ICU_BASE_URL=${BACKEND_INTERVALS_ICU_BASE_URL:-https://intervals.icu/api/v1}
      - BACKEND_INTERVALS_ICU_SYNC_ENABLED=${BACKEND_INTERVALS_ICU_SYNC_ENABLED:-false}
      - BACKEND_INTERVALS_ICU_SYNC_INTERVAL_MINUTES=${BACKEND_INTERVALS_ICU_SYNC_INTERVAL_MINUTES:-10}
      - BACKEND_INTERVALS_ICU_SYNC_LOOKBACK_DAYS=${BACKEND_INTERVALS_ICU_SYNC_LOOKBACK_DAYS:-3}
      - BACKEND_INTERVALS_ICU_ACTIVITY_TYPES=${BACKEND_INTERVALS_ICU_ACTIVITY_TYPES:-}

      # Backend - Scheduler
      - BACKEND_SCHEDULER_ENABLED=${BACKEND_SCHEDULER_ENABLED:-true}
      - BACKEND_SCHEDULER_INTERVAL_MINUTES=${BACKEND_SCHEDULER_INTERVAL_MINUTES:-30}

      # Backend - Logging
      - BACKEND_LOG_LEVEL=${BACKEND_LOG_LEVEL:-INFO}
      - BACKEND_LOG_FILE=${BACKEND_LOG_FILE:?BACKEND_LOG_FILE is required}

      # Backend - Monitoring
      - BACKEND_METRICS_TOKEN=${BACKEND_METRICS_TOKEN:?required}

      # Backend - Telegram (optional)
      - BACKEND_TELEGRAM_BOT_TOKEN=${BACKEND_TELEGRAM_BOT_TOKEN}
      - BACKEND_TELEGRAM_CHAT_ID=${BACKEND_TELEGRAM_CHAT_ID}

      # Backend - Authentication
      - BACKEND_JWT_SECRET=${BACKEND_JWT_SECRET:?required}
      - BACKEND_ADMIN_EMAIL=${BACKEND_ADMIN_EMAIL:?required}
      - BACKEND_ADMIN_PASSWORD=${BACKEND_ADMIN_PASSWORD:?required}

      # Backend - YouTube upload (optional)
      - BACKEND_YOUTUBE_CLIENT_ID=${BACKEND_YOUTUBE_CLIENT_ID:-}
      - BACKEND_YOUTUBE_CLIENT_SECRET=${BACKEND_YOUTUBE_CLIENT_SECRET:-}
      - BACKEND_YOUTUBE_REDIRECT_URI=${BACKEND_YOUTUBE_REDIRECT_URI:-}
      - BACKEND_YOUTUBE_UPLOAD_CHUNK_SIZE=${BACKEND_YOUTUBE_UPLOAD_CHUNK_SIZE:-8388608}

      # Backend - Frontend URL
      # Video export runs in a separate worker container; use Docker DNS by default.
      - BACKEND_FRONTEND_URL=${BACKEND_FRONTEND_URL:-http://backend:8001}

      # Backend - Video export storage
      - BACKEND_VIDEO_EXPORT_DIR=${BACKEND_VIDEO_EXPORT_DIR:-/app/video-exports}
      - BACKEND_VIDEO_TEMP_IMAGES_DIR=${BACKEND_VIDEO_TEMP_IMAGES_DIR:-/app/video-temp-images}
      - BACKEND_VIDEO_ACCELERATOR=${BACKEND_VIDEO_ACCELERATOR:-cpu}
      - BACKEND_GOPRO_OVERLAY_JOB_TIMEOUT_SECONDS=${BACKEND_GOPRO_OVERLAY_JOB_TIMEOUT_SECONDS:-43200}
      - BACKEND_EMAGRAM_CACHE_DIR=${BACKEND_EMAGRAM_CACHE_DIR:-/app/emagram-cache}

      # Backend - GoPro overlay toolchain
      - BACKEND_GOPRO_OVERLAY_ROOT=/app/gopro-overlay
      - BACKEND_GOPRO_OVERLAY_BIN=/app/gopro-overlay/venv/bin/gopro-dashboard.py
      - BACKEND_GOPRO_OVERLAY_LAYOUT_DIR=/app/gopro-overlay
      - BACKEND_GOPRO_OVERLAY_PARAGLIDING_ROOT=/app/parapente
      - BACKEND_GOPRO_OVERLAY_FONT=/usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf
      - BACKEND_GOPRO_OVERLAY_CONFIG_DIR=${BACKEND_GOPRO_OVERLAY_CONFIG_DIR:-}
      - BACKEND_GOPRO_OVERLAY_PROFILE=${BACKEND_GOPRO_OVERLAY_PROFILE:-}
      - BACKEND_GOPRO_OVERLAY_EXTRA_ARGS=${BACKEND_GOPRO_OVERLAY_EXTRA_ARGS:-}
      - BACKEND_GOPRO_OVERLAY_OSV_MERGE_TIMEOUT_SECONDS=${BACKEND_GOPRO_OVERLAY_OSV_MERGE_TIMEOUT_SECONDS:-1800}
      - BACKEND_GOPRO_OVERLAY_PROCESS_NICE=${BACKEND_GOPRO_OVERLAY_PROCESS_NICE:-0}
      - BACKEND_GOPRO_OVERLAY_PROCESS_IONICE_CLASS=${BACKEND_GOPRO_OVERLAY_PROCESS_IONICE_CLASS:-}
      - BACKEND_GOPRO_OVERLAY_MAX_AUTO_LAYOUT_WIDTH=${BACKEND_GOPRO_OVERLAY_MAX_AUTO_LAYOUT_WIDTH:-1920}
      - BACKEND_GOPRO_OVERLAY_MAX_AUTO_LAYOUT_HEIGHT=${BACKEND_GOPRO_OVERLAY_MAX_AUTO_LAYOUT_HEIGHT:-1080}

      # Backend - Deployment metadata
      - BACKEND_VERSION_STATE_FILE=${BACKEND_VERSION_STATE_FILE:?BACKEND_VERSION_STATE_FILE is required}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - /home/capic/docker-data/dashboard-parapente/db:/app/db
      - ${VIDEO_EXPORT_HOST_DIR:-/home/capic/docker-data/dashboard-parapente/videos}:${BACKEND_VIDEO_EXPORT_DIR:-/app/video-exports}
      - ${VIDEO_TEMP_IMAGES_HOST_DIR:-/home/capic/docker-data/dashboard-parapente/video-temp-images}:${BACKEND_VIDEO_TEMP_IMAGES_DIR:-/app/video-temp-images}
      - ${EMAGRAM_CACHE_HOST_DIR:-/home/capic/docker-data/dashboard-parapente/emagram-cache}:${BACKEND_EMAGRAM_CACHE_DIR:-/app/emagram-cache}
      - ${CODEX_HOME_HOST_DIR:-/home/capic/docker-data/dashboard-parapente/codex}:/app/codex-home
      - ${GOPRO_OVERLAY_DATA_HOST_DIR:?GOPRO_OVERLAY_DATA_HOST_DIR is required}:/app/parapente
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8001/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - parapente-network

  backend-worker:
    image: ${CI_BACKEND_IMAGE:-ghcr.io/capic2/dashboard-parapente/backend:main}
    container_name: parapente-backend-worker
    restart: unless-stopped
    command: ['python', 'job_worker.py']
    labels:
      project: dashboard-parapente
      service: backend-worker
      env: ${ENVIRONMENT:-production}
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - BACKEND_DATABASE_URL=${BACKEND_DATABASE_URL:?BACKEND_DATABASE_URL is required}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - BACKEND_REDIS_HOST=redis
      - BACKEND_REDIS_PORT=6379
      - BACKEND_USE_FAKE_REDIS=${BACKEND_USE_FAKE_REDIS:-false}
      - BACKEND_JOB_QUEUE_BACKEND=${BACKEND_JOB_QUEUE_BACKEND:-rq}
      - BACKEND_JOB_QUEUE_NAME=${BACKEND_JOB_QUEUE_NAME:-video_exports}
      # Run multiple consumers so long video jobs do not block other jobs.
      - BACKEND_WORKER_COUNT=${BACKEND_WORKER_COUNT:-5}
      - BACKEND_GOPRO_OVERLAY_QUEUE_NAME=${BACKEND_GOPRO_OVERLAY_QUEUE_NAME:-gopro_overlays}
      - BACKEND_GOPRO_PREVIEW_QUEUE_NAME=${BACKEND_GOPRO_PREVIEW_QUEUE_NAME:-gopro_previews}
      - BACKEND_API_HOST=${BACKEND_API_HOST:-0.0.0.0}
      - BACKEND_API_PORT=${BACKEND_API_PORT:-8001}
      - BACKEND_DEPLOY_DRAIN_TOKEN=${BACKEND_DEPLOY_DRAIN_TOKEN:-}
      - BACKEND_DEPLOY_DRAIN_LEASE_SECONDS=${BACKEND_DEPLOY_DRAIN_LEASE_SECONDS:-4500}
      - BACKEND_LOG_LEVEL=${BACKEND_LOG_LEVEL:-INFO}
      - BACKEND_LOG_FILE=${BACKEND_LOG_FILE:?BACKEND_LOG_FILE is required}
      - BACKEND_METRICS_TOKEN=${BACKEND_METRICS_TOKEN:?required}
      - BACKEND_JWT_SECRET=${BACKEND_JWT_SECRET:?required}
      - BACKEND_WEATHERAPI_KEY=${BACKEND_WEATHERAPI_KEY}
      - BACKEND_METEOBLUE_API_KEY=${BACKEND_METEOBLUE_API_KEY}
      # localhost inside this container is not the API container.
      - BACKEND_FRONTEND_URL=${BACKEND_FRONTEND_URL:-http://backend:8001}
      - BACKEND_VIDEO_EXPORT_DIR=${BACKEND_VIDEO_EXPORT_DIR:-/app/video-exports}
      - BACKEND_VIDEO_TEMP_IMAGES_DIR=${BACKEND_VIDEO_TEMP_IMAGES_DIR:-/app/video-temp-images}
      - BACKEND_VIDEO_ACCELERATOR=${BACKEND_VIDEO_ACCELERATOR:-cpu}
      - BACKEND_GOPRO_OVERLAY_JOB_TIMEOUT_SECONDS=${BACKEND_GOPRO_OVERLAY_JOB_TIMEOUT_SECONDS:-43200}
      - BACKEND_GOPRO_OVERLAY_ROOT=/app/gopro-overlay
      - BACKEND_GOPRO_OVERLAY_BIN=/app/gopro-overlay/venv/bin/gopro-dashboard.py
      - BACKEND_GOPRO_OVERLAY_LAYOUT_DIR=/app/gopro-overlay
      - BACKEND_GOPRO_OVERLAY_PARAGLIDING_ROOT=/app/parapente
      - BACKEND_GOPRO_OVERLAY_FONT=/usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf
      - BACKEND_GOPRO_OVERLAY_CONFIG_DIR=${BACKEND_GOPRO_OVERLAY_CONFIG_DIR:-}
      - BACKEND_GOPRO_OVERLAY_PROFILE=${BACKEND_GOPRO_OVERLAY_PROFILE:-}
      - BACKEND_GOPRO_OVERLAY_EXTRA_ARGS=${BACKEND_GOPRO_OVERLAY_EXTRA_ARGS:-}
      - BACKEND_GOPRO_OVERLAY_OSV_MERGE_TIMEOUT_SECONDS=${BACKEND_GOPRO_OVERLAY_OSV_MERGE_TIMEOUT_SECONDS:-1800}
      - BACKEND_GOPRO_OVERLAY_PROCESS_NICE=${BACKEND_GOPRO_OVERLAY_PROCESS_NICE:-0}
      - BACKEND_GOPRO_OVERLAY_PROCESS_IONICE_CLASS=${BACKEND_GOPRO_OVERLAY_PROCESS_IONICE_CLASS:-}
      - BACKEND_GOPRO_OVERLAY_MAX_AUTO_LAYOUT_WIDTH=${BACKEND_GOPRO_OVERLAY_MAX_AUTO_LAYOUT_WIDTH:-1920}
      - BACKEND_GOPRO_OVERLAY_MAX_AUTO_LAYOUT_HEIGHT=${BACKEND_GOPRO_OVERLAY_MAX_AUTO_LAYOUT_HEIGHT:-1080}
      - BACKEND_VERSION_STATE_FILE=${BACKEND_VERSION_STATE_FILE:?BACKEND_VERSION_STATE_FILE is required}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - /home/capic/docker-data/dashboard-parapente/db:/app/db
      - ${VIDEO_EXPORT_HOST_DIR:-/home/capic/docker-data/dashboard-parapente/videos}:${BACKEND_VIDEO_EXPORT_DIR:-/app/video-exports}
      - ${VIDEO_TEMP_IMAGES_HOST_DIR:-/home/capic/docker-data/dashboard-parapente/video-temp-images}:${BACKEND_VIDEO_TEMP_IMAGES_DIR:-/app/video-temp-images}
      - ${GOPRO_OVERLAY_DATA_HOST_DIR:?GOPRO_OVERLAY_DATA_HOST_DIR is required}:/app/parapente
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "from job_queue import get_redis_connection; get_redis_connection().ping()"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - parapente-network

  youtube-upload-worker:
    image: ${CI_BACKEND_IMAGE:-ghcr.io/capic2/dashboard-parapente/backend:main}
    container_name: parapente-youtube-upload-worker
    restart: unless-stopped
    command: ['python', 'youtube_upload_worker.py']
    labels:
      project: dashboard-parapente
      service: youtube-upload-worker
      env: ${ENVIRONMENT:-production}
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - BACKEND_DATABASE_URL=${BACKEND_DATABASE_URL:?BACKEND_DATABASE_URL is required}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - BACKEND_REDIS_HOST=redis
      - BACKEND_REDIS_PORT=6379
      - BACKEND_USE_FAKE_REDIS=${BACKEND_USE_FAKE_REDIS:-false}
      - BACKEND_JOB_QUEUE_BACKEND=${BACKEND_JOB_QUEUE_BACKEND:-rq}
      - BACKEND_JOB_QUEUE_NAME=${BACKEND_JOB_QUEUE_NAME:-video_exports}
      - BACKEND_YOUTUBE_UPLOAD_QUEUE_NAME=${BACKEND_YOUTUBE_UPLOAD_QUEUE_NAME:-youtube_uploads}
      - BACKEND_JOB_QUEUE_TIMEOUT_SECONDS=${BACKEND_JOB_QUEUE_TIMEOUT_SECONDS:-21600}
      - BACKEND_LOG_LEVEL=${BACKEND_LOG_LEVEL:-INFO}
      - BACKEND_LOG_FILE=${BACKEND_LOG_FILE:?BACKEND_LOG_FILE is required}
      - BACKEND_METRICS_TOKEN=${BACKEND_METRICS_TOKEN:?required}
      - BACKEND_JWT_SECRET=${BACKEND_JWT_SECRET:?required}
      - BACKEND_YOUTUBE_CLIENT_ID=${BACKEND_YOUTUBE_CLIENT_ID:-}
      - BACKEND_YOUTUBE_CLIENT_SECRET=${BACKEND_YOUTUBE_CLIENT_SECRET:-}
      - BACKEND_YOUTUBE_REDIRECT_URI=${BACKEND_YOUTUBE_REDIRECT_URI:-}
      - BACKEND_YOUTUBE_UPLOAD_CHUNK_SIZE=${BACKEND_YOUTUBE_UPLOAD_CHUNK_SIZE:-8388608}
      - BACKEND_VIDEO_EXPORT_DIR=${BACKEND_VIDEO_EXPORT_DIR:-/app/video-exports}
      - BACKEND_VERSION_STATE_FILE=${BACKEND_VERSION_STATE_FILE:?BACKEND_VERSION_STATE_FILE is required}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - /home/capic/docker-data/dashboard-parapente/db:/app/db
      - ${VIDEO_EXPORT_HOST_DIR:-/home/capic/docker-data/dashboard-parapente/videos}:${BACKEND_VIDEO_EXPORT_DIR:-/app/video-exports}
      - ${GOPRO_OVERLAY_DATA_HOST_DIR:?GOPRO_OVERLAY_DATA_HOST_DIR is required}:/app/parapente
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "from job_queue import get_redis_connection; get_redis_connection().ping()"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - parapente-network

  gopro-overlay-worker:
    image: ${CI_BACKEND_IMAGE:-ghcr.io/capic2/dashboard-parapente/backend:main}
    container_name: parapente-gopro-overlay-worker
    # This worker may be stopped during a deployment while an ffmpeg child is
    # still running. Always restart it so queued jobs cannot remain orphaned.
    restart: always
    init: true
    # Keep a short, configurable grace period so stopped video workers do not
    # delay every deployment while still allowing operators to increase it.
    stop_grace_period: ${GOPRO_OVERLAY_STOP_GRACE_PERIOD:-15s}
    command: ['python', 'gopro_overlay_worker.py']
    cpus: '${GOPRO_OVERLAY_WORKER_CPUS:-8.0}'
    mem_limit: ${GOPRO_OVERLAY_WORKER_MEM_LIMIT:-12g}
    pids_limit: ${GOPRO_OVERLAY_WORKER_PIDS_LIMIT:-1024}
    labels:
      project: dashboard-parapente
      service: gopro-overlay-worker
      env: ${ENVIRONMENT:-production}
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - BACKEND_DATABASE_URL=${BACKEND_DATABASE_URL:?BACKEND_DATABASE_URL is required}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - BACKEND_REDIS_HOST=redis
      - BACKEND_REDIS_PORT=6379
      - BACKEND_USE_FAKE_REDIS=${BACKEND_USE_FAKE_REDIS:-false}
      - BACKEND_JOB_QUEUE_BACKEND=${BACKEND_JOB_QUEUE_BACKEND:-rq}
      - BACKEND_JOB_QUEUE_NAME=${BACKEND_JOB_QUEUE_NAME:-video_exports}
      - BACKEND_GOPRO_OVERLAY_QUEUE_NAME=${BACKEND_GOPRO_OVERLAY_QUEUE_NAME:-gopro_overlays}
      - BACKEND_GOPRO_PREVIEW_QUEUE_NAME=${BACKEND_GOPRO_PREVIEW_QUEUE_NAME:-gopro_previews}
      - BACKEND_DEPLOY_DRAIN_TOKEN=${BACKEND_DEPLOY_DRAIN_TOKEN:-}
      - BACKEND_DEPLOY_DRAIN_LEASE_SECONDS=${BACKEND_DEPLOY_DRAIN_LEASE_SECONDS:-4500}
      - BACKEND_LOG_LEVEL=${BACKEND_LOG_LEVEL:-INFO}
      - BACKEND_LOG_FILE=${BACKEND_LOG_FILE:?BACKEND_LOG_FILE is required}
      - BACKEND_METRICS_TOKEN=${BACKEND_METRICS_TOKEN:?required}
      - BACKEND_JWT_SECRET=${BACKEND_JWT_SECRET:?required}
      - BACKEND_WEATHERAPI_KEY=${BACKEND_WEATHERAPI_KEY}
      - BACKEND_METEOBLUE_API_KEY=${BACKEND_METEOBLUE_API_KEY}
      - BACKEND_VIDEO_ACCELERATOR=${BACKEND_VIDEO_ACCELERATOR:-cpu}
      - BACKEND_GOPRO_OVERLAY_JOB_TIMEOUT_SECONDS=${BACKEND_GOPRO_OVERLAY_JOB_TIMEOUT_SECONDS:-43200}
      - BACKEND_GOPRO_OVERLAY_ROOT=/app/gopro-overlay
      - BACKEND_GOPRO_OVERLAY_BIN=/app/gopro-overlay/venv/bin/gopro-dashboard.py
      - BACKEND_GOPRO_OVERLAY_LAYOUT_DIR=/app/gopro-overlay
      - BACKEND_GOPRO_OVERLAY_PARAGLIDING_ROOT=/app/parapente
      - BACKEND_GOPRO_OVERLAY_FONT=/usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf
      - BACKEND_GOPRO_OVERLAY_CONFIG_DIR=${BACKEND_GOPRO_OVERLAY_CONFIG_DIR:-}
      - BACKEND_GOPRO_OVERLAY_PROFILE=${BACKEND_GOPRO_OVERLAY_PROFILE:-}
      - BACKEND_GOPRO_OVERLAY_EXTRA_ARGS=${BACKEND_GOPRO_OVERLAY_EXTRA_ARGS:-}
      - BACKEND_GOPRO_OVERLAY_OSV_MERGE_TIMEOUT_SECONDS=${BACKEND_GOPRO_OVERLAY_OSV_MERGE_TIMEOUT_SECONDS:-1800}
      - BACKEND_GOPRO_OVERLAY_PROCESS_NICE=${BACKEND_GOPRO_OVERLAY_PROCESS_NICE:-0}
      - BACKEND_GOPRO_OVERLAY_PROCESS_IONICE_CLASS=${BACKEND_GOPRO_OVERLAY_PROCESS_IONICE_CLASS:-}
      - BACKEND_GOPRO_OVERLAY_MAX_AUTO_LAYOUT_WIDTH=${BACKEND_GOPRO_OVERLAY_MAX_AUTO_LAYOUT_WIDTH:-1920}
      - BACKEND_GOPRO_OVERLAY_MAX_AUTO_LAYOUT_HEIGHT=${BACKEND_GOPRO_OVERLAY_MAX_AUTO_LAYOUT_HEIGHT:-1080}
      - BACKEND_VERSION_STATE_FILE=${BACKEND_VERSION_STATE_FILE:?BACKEND_VERSION_STATE_FILE is required}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - /home/capic/docker-data/dashboard-parapente/db:/app/db
      - ${VIDEO_EXPORT_HOST_DIR:-/home/capic/docker-data/dashboard-parapente/videos}:${BACKEND_VIDEO_EXPORT_DIR:-/app/video-exports}
      - ${VIDEO_TEMP_IMAGES_HOST_DIR:-/home/capic/docker-data/dashboard-parapente/video-temp-images}:${BACKEND_VIDEO_TEMP_IMAGES_DIR:-/app/video-temp-images}
      - ${GOPRO_OVERLAY_DATA_HOST_DIR:?GOPRO_OVERLAY_DATA_HOST_DIR is required}:/app/parapente
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "from job_queue import get_redis_connection; get_redis_connection().ping()"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - parapente-network

networks:
  parapente-network:
    driver: bridge
