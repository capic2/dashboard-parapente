services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        gopro-overlay-src: ${GOPRO_OVERLAY_BUILD_CONTEXT:-https://github.com/capic2/gopro-dashboard-overlay.git#21c7f4191a3f6efd0b759d7cdbe378c74fdfc4f7}
      args:
        - VITE_CESIUM_ION_TOKEN=${VITE_CESIUM_ION_TOKEN:?required}
    image: parapente-backend:nx-latest

  backend-worker:
    image: parapente-backend:nx-latest

  gopro-overlay-worker:
    image: parapente-backend:nx-latest
