services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        gopro-overlay-src: ${GOPRO_OVERLAY_BUILD_CONTEXT:-https://github.com/capic2/gopro-dashboard-overlay.git#657dd07a7d7e2f58ade271641326d0e00ff0027b}
      args:
        - VITE_CESIUM_ION_TOKEN=${VITE_CESIUM_ION_TOKEN:?required}
    image: parapente-backend:nx-latest

  backend-worker:
    image: parapente-backend:nx-latest

  gopro-overlay-worker:
    image: parapente-backend:nx-latest
