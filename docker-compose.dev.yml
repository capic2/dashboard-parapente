services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        gopro-overlay-src: ${GOPRO_OVERLAY_BUILD_CONTEXT:-https://github.com/capic2/gopro-dashboard-overlay.git#7cbf7be6499ee3cc3c968f0c3dedc7fa62d893c7}
      args:
        - VITE_CESIUM_ION_TOKEN=${VITE_CESIUM_ION_TOKEN:?required}
    image: parapente-backend:nx-latest

  backend-worker:
    image: parapente-backend:nx-latest

  gopro-overlay-worker:
    image: parapente-backend:nx-latest
