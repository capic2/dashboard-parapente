name: Deploy to Production (SSH)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  packages: write
  pull-requests: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy over SSH
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Compute deployment version
        id: version
        uses: actions/github-script@v9
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10).replace(/-/g, '.');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentSha = context.sha;

            const deployTagsResponse = await github.request(
              'GET /repos/{owner}/{repo}/git/matching-refs/{ref}',
              {
                owner,
                repo,
                ref: 'tags/deploy/',
              }
            );

            const successTagsResponse = await github.request(
              'GET /repos/{owner}/{repo}/git/matching-refs/{ref}',
              {
                owner,
                repo,
                ref: 'tags/deploy-success/',
              }
            );

            const parsedDeployTags = deployTagsResponse.data
              .map((item) => {
                const match = item.ref.match(/^refs\/tags\/deploy\/(\d{4}\.\d{2}\.\d{2})\.(\d+)$/);
                if (!match) return null;
                return {
                  ref: item.ref,
                  date: match[1],
                  number: Number(match[2]),
                  sha: item.object.sha,
                };
              })
              .filter(Boolean)
              .sort((a, b) => {
                if (a.date === b.date) return a.number - b.number;
                return a.date.localeCompare(b.date);
              });

            const parsedSuccessTags = successTagsResponse.data
              .map((item) => {
                const match = item.ref.match(/^refs\/tags\/deploy-success\/(\d{4}\.\d{2}\.\d{2})\.(\d+)$/);
                if (!match) return null;
                return {
                  ref: item.ref,
                  date: match[1],
                  number: Number(match[2]),
                  sha: item.object.sha,
                };
              })
              .filter(Boolean)
              .sort((a, b) => {
                if (a.date === b.date) return a.number - b.number;
                return a.date.localeCompare(b.date);
              });

            const existingTagForSha = parsedDeployTags.find((tag) => tag.sha === currentSha);

            let version;
            if (existingTagForSha) {
              version = `${existingTagForSha.date}.${existingTagForSha.number}`;
              core.info(`Reusing deployment version ${version} for SHA ${currentSha}`);
            } else {
              const latestToday = parsedDeployTags
                .filter((tag) => tag.date === date)
                .reduce((max, tag) => Math.max(max, tag.number), 0);
              const nextNumber = latestToday + 1;
              version = `${date}.${nextNumber}`;
              core.info(`Assigned new deployment version ${version} for SHA ${currentSha}`);
            }

            const latestSuccessfulTag =
              parsedSuccessTags.length > 0
                ? parsedSuccessTags[parsedSuccessTags.length - 1]
                : parsedDeployTags
                    .filter((tag) => tag.sha !== currentSha)
                    .at(-1);

            core.setOutput('version', version);
            core.setOutput('tag_name', `deploy/${version}`);
            core.setOutput('success_tag_name', `deploy-success/${version}`);
            core.setOutput('label_name', `version:${version}`);
            core.setOutput('previous_deploy_sha', latestSuccessfulTag ? latestSuccessfulTag.sha : '');

            if (latestSuccessfulTag) {
              core.info(`Previous successful deployment tag: ${latestSuccessfulTag.ref} (${latestSuccessfulTag.sha})`);
            }

      - name: Reserve deployment tag
        uses: actions/github-script@v9
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          TARGET_SHA: ${{ github.sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tagName = process.env.TAG_NAME;
            const targetSha = process.env.TARGET_SHA;

            try {
              await github.request('POST /repos/{owner}/{repo}/git/refs', {
                owner,
                repo,
                ref: `refs/tags/${tagName}`,
                sha: targetSha,
              });
              core.info(`Reserved deployment tag ${tagName} on ${targetSha}`);
            } catch (error) {
              if (error.status === 422) {
                const existingRef = await github.request(
                  'GET /repos/{owner}/{repo}/git/ref/{ref}',
                  {
                    owner,
                    repo,
                    ref: `tags/${tagName}`,
                  }
                );

                if (existingRef.data.object.sha !== targetSha) {
                  throw new Error(
                    `Tag ${tagName} already exists on ${existingRef.data.object.sha}, expected ${targetSha}`
                  );
                }

                core.info(`Deployment tag ${tagName} already exists on ${targetSha}, reusing it`);
              } else {
                throw error;
              }
            }

      - name: Checkout source for image build
        uses: actions/checkout@v7

      - name: Verify GoPro overlay build context
        env:
          GOPRO_OVERLAY_BUILD_CONTEXT: ${{ vars.GOPRO_OVERLAY_BUILD_CONTEXT || 'https://github.com/capic2/gopro-dashboard-overlay.git#main' }}
        run: |
          if [ -z "$GOPRO_OVERLAY_BUILD_CONTEXT" ]; then
            echo "Missing repository variable GOPRO_OVERLAY_BUILD_CONTEXT"
            echo "Set it to a Docker BuildKit context for gopro-overlay-src, for example a Git URL."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push backend image
        id: build_image
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            VITE_CESIUM_ION_TOKEN=${{ secrets.VITE_CESIUM_ION_TOKEN }}
          build-contexts: |
            gopro-overlay-src=${{ vars.GOPRO_OVERLAY_BUILD_CONTEXT || 'https://github.com/capic2/gopro-dashboard-overlay.git#main' }}
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}/backend:main
            ghcr.io/${{ github.repository }}/backend:sha-${{ github.sha }}

      - name: Begin production deployment drain
        id: begin_drain
        if: steps.build_image.outcome == 'success' && vars.DEPLOY_DRAIN_ENABLED == 'true'
        continue-on-error: true
        env:
          DRAIN_BASE_URL: ${{ secrets.PRODUCTION_DEPLOY_DRAIN_URL }}
          DRAIN_API_TOKEN: ${{ secrets.DEPLOY_DRAIN_API_TOKEN }}
          DEPLOYMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          TARGET_VERSION: ${{ steps.version.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu

          if [ -z "$DRAIN_BASE_URL" ]; then
            echo "Missing PRODUCTION_DEPLOY_DRAIN_URL secret"
            exit 1
          fi
          if [ -z "$DRAIN_API_TOKEN" ]; then
            echo "Missing DEPLOY_DRAIN_API_TOKEN secret"
            exit 1
          fi
          if ! python -c 'import os, sys; from urllib.parse import urlparse; url = urlparse(os.environ["DRAIN_BASE_URL"]); sys.exit(0 if url.scheme in ("http", "https") and url.netloc and url.path.endswith("/api/deployment-drain") and not url.params and not url.query and not url.fragment else 1)'; then
            echo "PRODUCTION_DEPLOY_DRAIN_URL must be a full HTTP(S) URL ending in /api/deployment-drain"
            exit 1
          fi

          payload=$(python -c 'import json, os; print(json.dumps({"deployment_id": os.environ["DEPLOYMENT_ID"], "target_version": os.environ["TARGET_VERSION"], "run_url": os.environ["RUN_URL"]}))')
          response=$(curl --show-error --silent --fail-with-body \
            --connect-timeout 5 --max-time 20 \
            --request PUT \
            --header "Authorization: Bearer $DRAIN_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$DRAIN_BASE_URL")

          if ! parsed=$(python -c 'import json, sys; data=json.load(sys.stdin); phase=data["phase"]; ready=data["ready_for_deployment"]; active=data["active_jobs"]; admissions=data["admissions_in_progress"]; assert phase in ("waiting", "deploying") and type(ready) is bool and type(active) is int and active >= 0 and type(admissions) is int and admissions >= 0; print(f"{phase}\t{str(ready).lower()}\t{active}\t{admissions}")' <<< "$response" 2>/dev/null); then
            echo "Deployment drain begin returned malformed JSON"
            exit 1
          fi

          IFS=$'\t' read -r phase ready active_jobs admissions_in_progress <<< "$parsed"
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "ready_for_deployment=$ready" >> "$GITHUB_OUTPUT"
          echo "active_jobs=$active_jobs" >> "$GITHUB_OUTPUT"
          echo "admissions_in_progress=$admissions_in_progress" >> "$GITHUB_OUTPUT"
          echo "Deployment drain acquired: phase=$phase active_jobs=$active_jobs admissions_in_progress=$admissions_in_progress"

      - name: Wait for production jobs to drain
        id: wait_drain
        if: steps.build_image.outcome == 'success' && vars.DEPLOY_DRAIN_ENABLED == 'true' && steps.begin_drain.outcome == 'success'
        continue-on-error: true
        env:
          DRAIN_BASE_URL: ${{ secrets.PRODUCTION_DEPLOY_DRAIN_URL }}
          DRAIN_API_TOKEN: ${{ secrets.DEPLOY_DRAIN_API_TOKEN }}
          DEPLOYMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          MAX_ATTEMPTS: ${{ vars.DEPLOY_DRAIN_MAX_ATTEMPTS || '120' }}
          SLEEP_SECONDS: ${{ vars.DEPLOY_DRAIN_SLEEP_SECONDS || '30' }}
        run: |
          set -eu

          if [ -z "$DRAIN_BASE_URL" ]; then
            echo "Missing PRODUCTION_DEPLOY_DRAIN_URL secret"
            exit 1
          fi
          if [ -z "$DRAIN_API_TOKEN" ]; then
            echo "Missing DEPLOY_DRAIN_API_TOKEN secret"
            exit 1
          fi
          case "$MAX_ATTEMPTS" in
            ''|*[!0-9]*|0) echo "DEPLOY_DRAIN_MAX_ATTEMPTS must be a positive integer"; exit 1 ;;
          esac
          case "$SLEEP_SECONDS" in
            ''|*[!0-9]*|0) echo "DEPLOY_DRAIN_SLEEP_SECONDS must be a positive integer"; exit 1 ;;
          esac

          started_at=$(date +%s)
          max_wait_seconds=$((MAX_ATTEMPTS * SLEEP_SECONDS))
          deadline=$((started_at + max_wait_seconds))
          last_active_jobs=unknown
          last_admissions_in_progress=unknown

          sleep_when_attempts_remain() {
            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              return
            fi
            remaining_seconds=$((deadline - $(date +%s)))
            if [ "$remaining_seconds" -le 0 ]; then
              return
            fi
            delay=$SLEEP_SECONDS
            if [ "$delay" -gt "$remaining_seconds" ]; then
              delay=$remaining_seconds
            fi
            sleep "$delay"
          }

          attempt=1
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            remaining_seconds=$((deadline - $(date +%s)))
            if [ "$remaining_seconds" -le 0 ]; then
              break
            fi
            request_timeout=20
            if [ "$request_timeout" -gt "$remaining_seconds" ]; then
              request_timeout=$remaining_seconds
            fi

            if ! response=$(curl --show-error --silent --fail-with-body \
              --connect-timeout 5 --max-time "$request_timeout" \
              --header "Authorization: Bearer $DRAIN_API_TOKEN" \
              "$DRAIN_BASE_URL/$DEPLOYMENT_ID"); then
              waited_seconds=$(( $(date +%s) - started_at ))
              echo "waited_seconds=$waited_seconds" >> "$GITHUB_OUTPUT"
              echo "::warning::$(date -u +'%Y-%m-%dT%H:%M:%SZ') attempt $attempt/$MAX_ATTEMPTS: drain status request failed active_jobs=$last_active_jobs admissions_in_progress=$last_admissions_in_progress waited_seconds=$waited_seconds; retrying when attempts remain"
              sleep_when_attempts_remain
              attempt=$((attempt + 1))
              continue
            fi

            if ! parsed=$(python -c 'import json, sys; data=json.load(sys.stdin); phase=data["phase"]; ready=data["ready_for_deployment"]; active=data["active_jobs"]; admissions=data["admissions_in_progress"]; assert phase in ("waiting", "deploying") and type(ready) is bool and type(active) is int and active >= 0 and type(admissions) is int and admissions >= 0; print(f"{phase}\t{str(ready).lower()}\t{active}\t{admissions}")' <<< "$response" 2>/dev/null); then
              waited_seconds=$(( $(date +%s) - started_at ))
              echo "waited_seconds=$waited_seconds" >> "$GITHUB_OUTPUT"
              echo "::warning::$(date -u +'%Y-%m-%dT%H:%M:%SZ') attempt $attempt/$MAX_ATTEMPTS: drain status returned malformed JSON active_jobs=$last_active_jobs admissions_in_progress=$last_admissions_in_progress waited_seconds=$waited_seconds; treating it as not ready and retrying when attempts remain"
              sleep_when_attempts_remain
              attempt=$((attempt + 1))
              continue
            fi

            IFS=$'\t' read -r phase ready active_jobs admissions_in_progress <<< "$parsed"
            last_active_jobs=$active_jobs
            last_admissions_in_progress=$admissions_in_progress
            waited_seconds=$(( $(date +%s) - started_at ))
            echo "last_active_jobs=$active_jobs" >> "$GITHUB_OUTPUT"
            echo "last_admissions_in_progress=$admissions_in_progress" >> "$GITHUB_OUTPUT"
            echo "waited_seconds=$waited_seconds" >> "$GITHUB_OUTPUT"
            echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ') attempt $attempt/$MAX_ATTEMPTS: phase=$phase active_jobs=$active_jobs admissions_in_progress=$admissions_in_progress waited_seconds=$waited_seconds"

            if [ "$ready" = "true" ]; then
              echo "Production is ready for deployment"
              exit 0
            fi

            sleep_when_attempts_remain
            attempt=$((attempt + 1))
          done

          waited_seconds=$(( $(date +%s) - started_at ))
          echo "waited_seconds=$waited_seconds" >> "$GITHUB_OUTPUT"
          echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ') production drain timed out active_jobs=$last_active_jobs admissions_in_progress=$last_admissions_in_progress waited_seconds=$waited_seconds without stopping active jobs"
          exit 1

      - name: Mark production drain as deploying
        id: mark_drain_deploying
        if: steps.build_image.outcome == 'success' && vars.DEPLOY_DRAIN_ENABLED == 'true' && steps.begin_drain.outcome == 'success' && steps.wait_drain.outcome == 'success'
        continue-on-error: true
        env:
          DRAIN_BASE_URL: ${{ secrets.PRODUCTION_DEPLOY_DRAIN_URL }}
          DRAIN_API_TOKEN: ${{ secrets.DEPLOY_DRAIN_API_TOKEN }}
          DEPLOYMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -eu

          if [ -z "$DRAIN_BASE_URL" ]; then
            echo "Missing PRODUCTION_DEPLOY_DRAIN_URL secret"
            exit 1
          fi
          if [ -z "$DRAIN_API_TOKEN" ]; then
            echo "Missing DEPLOY_DRAIN_API_TOKEN secret"
            exit 1
          fi

          response=$(curl --show-error --silent --fail-with-body \
            --connect-timeout 5 --max-time 20 \
            --request POST \
            --header "Authorization: Bearer $DRAIN_API_TOKEN" \
            "$DRAIN_BASE_URL/$DEPLOYMENT_ID/deploying")

          if ! phase=$(python -c 'import json, sys; data=json.load(sys.stdin); phase=data["phase"]; ready=data["ready_for_deployment"]; active=data["active_jobs"]; admissions=data["admissions_in_progress"]; assert phase == "deploying" and type(ready) is bool and type(active) is int and active >= 0 and type(admissions) is int and admissions >= 0; print(phase)' <<< "$response" 2>/dev/null); then
            echo "Mark-deploying response returned malformed JSON"
            exit 1
          fi
          echo "Deployment drain phase: $phase"

      - name: Deploy on production server
        id: trigger_deploy
        if: steps.build_image.outcome == 'success' && (vars.DEPLOY_DRAIN_ENABLED != 'true' || (steps.begin_drain.outcome == 'success' && steps.wait_drain.outcome == 'success' && steps.mark_drain_deploying.outcome == 'success'))
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 15m
          script: |
            set -eu

            REQUESTED_DEPLOY_PATH="${{ secrets.SSH_DEPLOY_PATH }}"
            DEPLOY_PATH="$REQUESTED_DEPLOY_PATH"
            STACK_ID=""
            PORTAINER_VOLUME=""
            TARGET_SHA="${{ github.sha }}"
            TARGET_VERSION="${{ steps.version.outputs.version }}"
            REPO_SLUG="${{ github.repository }}"
            COMPOSE_PROJECT_NAME="dashboard-parapente"
            BACKEND_IMAGE="ghcr.io/${{ github.repository }}/backend:${{ steps.version.outputs.version }}"
            GHCR_USERNAME="${{ github.actor }}"
            GHCR_TOKEN="${{ secrets.GHCR_READ_TOKEN }}"

            if [ -z "$GHCR_TOKEN" ]; then
              echo "Missing GHCR_READ_TOKEN secret for production image pull"
              exit 1
            fi

            is_forbidden_deploy_path() {
              path="$1"
              case "$path" in
                .codenomad|.codenomad/*|*/.codenomad|*/.codenomad/*|.agents|.agents/*|*/.agents|*/.agents/*|.opencode|.opencode/*|*/.opencode|*/.opencode/*)
                  return 0
                  ;;
              esac

              return 1
            }

            set_portainer_volume() {
              for volume_name in portainer_data portainer; do
                if docker volume inspect "$volume_name" >/dev/null 2>&1; then
                  PORTAINER_VOLUME="$volume_name"
                  return 0
                fi
              done

              return 1
            }

            resolve_from_portainer_volume() {
              if ! set_portainer_volume; then
                return 1
              fi

              STACK_ID=$(docker run --rm \
                -v "$PORTAINER_VOLUME:/data" \
                docker:27-cli sh -ceu '
                  for compose_file in /data/compose/*/docker-compose.yml /data/compose/*/compose.yml; do
                    [ -f "$compose_file" ] || continue
                    if grep -q "dashboard-parapente" "$compose_file" || grep -q "parapente-backend" "$compose_file"; then
                      basename "$(dirname "$compose_file")"
                      exit 0
                    fi
                  done
                ' 2>/dev/null || true)

              if [ -n "$STACK_ID" ]; then
                echo "Resolved Portainer stack id from volume $PORTAINER_VOLUME: $STACK_ID"
                return 0
              fi

              return 1
            }

            configure_compose_cmd() {
              if [ -f stack.env ]; then
                compose_cmd() { docker compose -p "$COMPOSE_PROJECT_NAME" --env-file stack.env "$@"; }
                echo "Using stack.env for docker compose"
              elif [ -f .env ]; then
                compose_cmd() { docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env "$@"; }
                echo "Using .env for docker compose"
              else
                compose_cmd() { docker compose -p "$COMPOSE_PROJECT_NAME" "$@"; }
                echo "No env file found (stack.env/.env), using shell environment"
              fi
            }

            deploy_from_compose_path() {
              path="$1"

              if is_forbidden_deploy_path "$path"; then
                echo "Refusing to deploy from forbidden path: $path"
                return 1
              fi

              cd "$path"

              if [ -d .git ]; then
                echo "Refusing to deploy from a Git checkout: $path"
                return 1
              fi

              echo "Updating production compose file from $REPO_SLUG@$TARGET_SHA"
              curl -fsSL "https://raw.githubusercontent.com/$REPO_SLUG/$TARGET_SHA/docker-compose.yml" -o docker-compose.yml.tmp
              mv docker-compose.yml.tmp docker-compose.yml

              configure_compose_cmd

              printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

              export BACKEND_IMAGE
              export BACKEND_DEPLOY_VERSION="$TARGET_VERSION"

              compose_cmd pull backend backend-worker gopro-overlay-worker redis
              compose_cmd up -d --force-recreate --remove-orphans backend backend-worker gopro-overlay-worker redis
            }

            deploy_from_portainer_volume() {
              docker run --rm \
                -e BACKEND_IMAGE="$BACKEND_IMAGE" \
                -e COMPOSE_PROJECT_NAME="$COMPOSE_PROJECT_NAME" \
                -e GHCR_TOKEN="$GHCR_TOKEN" \
                -e GHCR_USERNAME="$GHCR_USERNAME" \
                -e REPO_SLUG="$REPO_SLUG" \
                -e TARGET_SHA="$TARGET_SHA" \
                -e TARGET_VERSION="$TARGET_VERSION" \
                -e STACK_ID="$STACK_ID" \
                -v /var/run/docker.sock:/var/run/docker.sock \
                -v "$PORTAINER_VOLUME:/data" \
                -w "/data/compose/$STACK_ID" \
                docker:27-cli sh -ceu '
                  apk add --no-cache curl >/dev/null
                  work_dir="/data/compose/$STACK_ID"
                  cd "$work_dir"

                  curl -fsSL "https://raw.githubusercontent.com/$REPO_SLUG/$TARGET_SHA/docker-compose.yml" -o docker-compose.yml.tmp
                  mv docker-compose.yml.tmp docker-compose.yml

                  if [ -f stack.env ]; then
                    compose_cmd() { docker compose -p "$COMPOSE_PROJECT_NAME" --env-file stack.env "$@"; }
                  elif [ -f .env ]; then
                    compose_cmd() { docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env "$@"; }
                  else
                    compose_cmd() { docker compose -p "$COMPOSE_PROJECT_NAME" "$@"; }
                  fi

                  printf "%s" "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

                  export BACKEND_IMAGE
                  export BACKEND_DEPLOY_VERSION="$TARGET_VERSION"

                  compose_cmd pull backend backend-worker gopro-overlay-worker redis
                  compose_cmd up -d --force-recreate --remove-orphans backend backend-worker gopro-overlay-worker redis
                '
            }

            if [ -n "$DEPLOY_PATH" ] && [ -d "$DEPLOY_PATH" ]; then
              echo "Deploying from configured compose path: $DEPLOY_PATH"
              deploy_from_compose_path "$DEPLOY_PATH"
              exit 0
            fi

            if [ -n "$DEPLOY_PATH" ]; then
              echo "Configured deploy path not found: $DEPLOY_PATH"
            fi

            if resolve_from_portainer_volume; then
              echo "Configured host path unavailable, deploying compose from Portainer volume $PORTAINER_VOLUME (stack $STACK_ID)"
              deploy_from_portainer_volume
              exit 0
            fi

            echo "Deploy path does not exist: $DEPLOY_PATH"
            if [ -n "$REQUESTED_DEPLOY_PATH" ]; then
              echo "Configured SSH_DEPLOY_PATH: $REQUESTED_DEPLOY_PATH"
            fi
            echo "Unable to access deploy path on host and no Portainer volume fallback available"
            exit 1

      - name: Verify deployed version
        id: verify_deploy
        if: always() && steps.trigger_deploy.outcome == 'success'
        continue-on-error: true
        env:
          VERSION_ENDPOINT_URL: ${{ secrets.PRODUCTION_VERSION_URL }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          MAX_ATTEMPTS: ${{ vars.DEPLOY_VERIFY_MAX_ATTEMPTS || '30' }}
          SLEEP_SECONDS: ${{ vars.DEPLOY_VERIFY_SLEEP_SECONDS || '10' }}
        run: |
          if [ -z "$VERSION_ENDPOINT_URL" ]; then
            echo "Missing PRODUCTION_VERSION_URL secret"
            exit 1
          fi

          if [ -z "$EXPECTED_VERSION" ]; then
            echo "Missing expected deployment version"
            exit 1
          fi

          attempt=1
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            response=$(curl --show-error --silent --fail --max-time 10 "$VERSION_ENDPOINT_URL" 2>/tmp/version-check.err || true)
            deployed_version=$(python -c "import json,sys; data=json.load(sys.stdin); print(data.get('version',''))" <<< "$response" 2>/dev/null || true)

            if [ "$deployed_version" = "$EXPECTED_VERSION" ]; then
              echo "Deployment version verified: $deployed_version"
              exit 0
            fi

            if [ -n "$deployed_version" ]; then
              echo "Attempt $attempt/$MAX_ATTEMPTS: expected $EXPECTED_VERSION, got $deployed_version"
            else
              curl_error=$(tr -d '\n' </tmp/version-check.err)
              if [ -n "$curl_error" ]; then
                echo "Attempt $attempt/$MAX_ATTEMPTS: version endpoint unreachable ($curl_error)"
              else
                echo "Attempt $attempt/$MAX_ATTEMPTS: version endpoint not ready"
              fi
            fi

            sleep "$SLEEP_SECONDS"
            attempt=$((attempt + 1))
          done

          echo "Failed to verify deployed version $EXPECTED_VERSION via $VERSION_ENDPOINT_URL"
          exit 1

      - name: Release production deployment drain
        id: release_drain
        if: always() && vars.DEPLOY_DRAIN_ENABLED == 'true' && steps.begin_drain.outcome != 'skipped'
        continue-on-error: true
        env:
          DRAIN_BASE_URL: ${{ secrets.PRODUCTION_DEPLOY_DRAIN_URL }}
          DRAIN_API_TOKEN: ${{ secrets.DEPLOY_DRAIN_API_TOKEN }}
          DEPLOYMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -eu

          if [ -z "$DRAIN_BASE_URL" ]; then
            echo "Missing PRODUCTION_DEPLOY_DRAIN_URL secret during drain release"
            exit 1
          fi
          if [ -z "$DRAIN_API_TOKEN" ]; then
            echo "Missing DEPLOY_DRAIN_API_TOKEN secret during drain release"
            exit 1
          fi

          max_attempts=60
          sleep_seconds=5
          attempt=1
          while [ "$attempt" -le "$max_attempts" ]; do
            if http_code=$(curl --show-error --silent --fail-with-body \
              --connect-timeout 5 --max-time 15 \
              --request DELETE \
              --header "Authorization: Bearer $DRAIN_API_TOKEN" \
              --output /tmp/deployment-drain-release-body \
              --write-out '%{http_code}' \
              "$DRAIN_BASE_URL/$DEPLOYMENT_ID"); then
              :
            fi

            if [ "$http_code" = "204" ] || [ "$http_code" = "404" ]; then
              echo "Production deployment drain released (HTTP $http_code)"
              exit 0
            fi

            echo "Drain release attempt $attempt/$max_attempts returned HTTP $http_code; API may still be restarting"
            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep "$sleep_seconds"
            fi
            attempt=$((attempt + 1))
          done

          echo "Failed to release production deployment drain; lease TTL remains the fallback"
          exit 1

      - name: Cleanup unused Docker images
        if: steps.trigger_deploy.outcome == 'success' && steps.verify_deploy.outcome == 'success' && (vars.DEPLOY_DRAIN_ENABLED != 'true' || steps.release_drain.outcome == 'success')
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 5m
          script: |
            set -u
            cleanup_old_backend_images() {
              backend_repo="ghcr.io/${{ github.repository }}/backend"
              current_backend_image="$backend_repo:${{ steps.version.outputs.version }}"

              if ! current_image_id=$(docker image inspect --format '{{.Id}}' "$current_backend_image" 2>/dev/null); then
                echo "Current backend image not found locally, skipping old backend image cleanup: $current_backend_image"
                return 0
              fi

              docker image ls --format '{{.Repository}}:{{.Tag}}' "$backend_repo" | while read -r image_ref; do
                [ -n "$image_ref" ] || continue
                case "$image_ref" in
                  *:\<none\>) continue ;;
                esac

                if ! image_id=$(docker image inspect --format '{{.Id}}' "$image_ref" 2>/dev/null); then
                  echo "Unable to inspect backend image $image_ref, skipping"
                  continue
                fi

                if [ "$image_id" = "$current_image_id" ]; then
                  echo "Keeping current backend image tag: $image_ref"
                  continue
                fi

                echo "Removing old backend image tag: $image_ref"
                if ! docker image rm "$image_ref"; then
                  echo "Old backend image cleanup failed for $image_ref; deployment remains successful"
                fi
              done
            }

            cleanup_old_backend_images

            if ! docker image prune -f; then
              echo "Docker image cleanup failed; deployment remains successful"
            fi
            if ! docker buildx prune -af; then
              echo "Docker buildx cleanup failed; deployment remains successful"
            fi

      - name: Label merged PRs with deployed version
        id: label_deployed_prs
        if: steps.trigger_deploy.outcome == 'success' && steps.verify_deploy.outcome == 'success' && (vars.DEPLOY_DRAIN_ENABLED != 'true' || (steps.begin_drain.outcome == 'success' && steps.wait_drain.outcome == 'success' && steps.mark_drain_deploying.outcome == 'success' && steps.release_drain.outcome == 'success'))
        uses: actions/github-script@v9
        env:
          VERSION_LABEL: ${{ steps.version.outputs.label_name }}
          UNDEPLOYED_LABEL: non déployé
          PREVIOUS_DEPLOY_SHA: ${{ steps.version.outputs.previous_deploy_sha }}
          CURRENT_SHA: ${{ github.sha }}
          CURRENT_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const versionLabel = process.env.VERSION_LABEL;
            const undeployedLabel = process.env.UNDEPLOYED_LABEL;
            const previousDeploySha = process.env.PREVIOUS_DEPLOY_SHA;
            const currentSha = process.env.CURRENT_SHA;
            const currentPrNumber = process.env.CURRENT_PR_NUMBER;
            const prNumbers = new Set();

            core.info(`Deployment label range: ${previousDeploySha || '<none>'}...${currentSha}`);

            if (currentPrNumber) {
              prNumbers.add(Number(currentPrNumber));
            }

            if (previousDeploySha && previousDeploySha !== currentSha) {
              const compareCommits = await github.paginate(
                'GET /repos/{owner}/{repo}/compare/{basehead}',
                {
                  owner,
                  repo,
                  basehead: `${previousDeploySha}...${currentSha}`,
                  per_page: 100,
                },
                (response) => response.data.commits || []
              );

              const commitsNeedingLookup = [];
              const prNumberPattern = /\(#(\d+)\)|^Merge pull request #(\d+)/;

              for (const commit of compareCommits) {
                const message = commit.commit?.message || '';
                const match = message.match(prNumberPattern);
                const parsedPr = Number(match?.[1] || match?.[2] || 0);

                if (Number.isInteger(parsedPr) && parsedPr > 0) {
                  prNumbers.add(parsedPr);
                } else {
                  commitsNeedingLookup.push(commit.sha);
                }
              }

              const chunkSize = 10;
              for (let index = 0; index < commitsNeedingLookup.length; index += chunkSize) {
                const chunk = commitsNeedingLookup.slice(index, index + chunkSize);
                const responses = await Promise.all(
                  chunk.map((commitSha) =>
                    github.request('GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls', {
                      owner,
                      repo,
                      commit_sha: commitSha,
                    })
                  )
                );

                for (const commitPrs of responses) {
                  for (const pr of commitPrs.data) {
                    if (pr.base?.ref === 'main' && pr.merged_at) {
                      prNumbers.add(pr.number);
                    }
                  }
                }

                if (index + chunkSize < commitsNeedingLookup.length) {
                  await new Promise((resolve) => setTimeout(resolve, 200));
                }
              }
            }

            try {
              await github.request('GET /repos/{owner}/{repo}/labels/{name}', {
                owner,
                repo,
                name: versionLabel,
              });
            } catch (error) {
              if (error.status === 404) {
                await github.request('POST /repos/{owner}/{repo}/labels', {
                  owner,
                  repo,
                  name: versionLabel,
                  color: '1D76DB',
                  description: 'Pull requests included in this deployed version',
                });
              } else {
                throw error;
              }
            }

            if (prNumbers.size === 0) {
              if (previousDeploySha && previousDeploySha !== currentSha) {
                core.warning('No merged pull requests found to label despite a non-empty deployment range');
              } else {
                core.info('No merged pull requests found to label for this deployment');
              }
              return;
            }

            for (const issue_number of prNumbers) {
              await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/labels', {
                owner,
                repo,
                issue_number,
                labels: [versionLabel],
              });

              try {
                await github.request('DELETE /repos/{owner}/{repo}/issues/{issue_number}/labels/{name}', {
                  owner,
                  repo,
                  issue_number,
                  name: undeployedLabel,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
            }

            core.info(
              `Applied label ${versionLabel} to PRs: ${Array.from(prNumbers)
                .sort((a, b) => a - b)
                .join(', ')}`
            );

      - name: Mark deployment as successful
        if: steps.trigger_deploy.outcome == 'success' && steps.verify_deploy.outcome == 'success' && steps.label_deployed_prs.outcome == 'success' && (vars.DEPLOY_DRAIN_ENABLED != 'true' || (steps.begin_drain.outcome == 'success' && steps.wait_drain.outcome == 'success' && steps.mark_drain_deploying.outcome == 'success' && steps.release_drain.outcome == 'success'))
        uses: actions/github-script@v9
        env:
          TAG_NAME: ${{ steps.version.outputs.success_tag_name }}
          TARGET_SHA: ${{ github.sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tagName = process.env.TAG_NAME;
            const targetSha = process.env.TARGET_SHA;

            try {
              await github.request('POST /repos/{owner}/{repo}/git/refs', {
                owner,
                repo,
                ref: `refs/tags/${tagName}`,
                sha: targetSha,
              });
              core.info(`Created success tag ${tagName} on ${targetSha}`);
            } catch (error) {
              if (error.status === 422) {
                const existingRef = await github.request(
                  'GET /repos/{owner}/{repo}/git/ref/{ref}',
                  {
                    owner,
                    repo,
                    ref: `tags/${tagName}`,
                  }
                );

                if (existingRef.data.object.sha !== targetSha) {
                  throw new Error(
                    `Tag ${tagName} already exists on ${existingRef.data.object.sha}, expected ${targetSha}`
                  );
                }

                core.info(`Success tag ${tagName} already exists on ${targetSha}, skipping creation`);
              } else {
                throw error;
              }
            }

      - name: Label merged PRs as non deployed when deployment fails
        if: >-
          always() && (
            steps.build_image.outcome != 'success' ||
            steps.trigger_deploy.outcome != 'success' ||
            steps.verify_deploy.outcome != 'success' ||
            (vars.DEPLOY_DRAIN_ENABLED == 'true' && (
              steps.begin_drain.outcome != 'success' ||
              steps.wait_drain.outcome != 'success' ||
              steps.mark_drain_deploying.outcome != 'success' ||
              steps.release_drain.outcome != 'success'
            ))
          )
        uses: actions/github-script@v9
        env:
          UNDEPLOYED_LABEL: non déployé
          PREVIOUS_DEPLOY_SHA: ${{ steps.version.outputs.previous_deploy_sha }}
          CURRENT_SHA: ${{ github.sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const undeployedLabel = process.env.UNDEPLOYED_LABEL;
            const previousDeploySha = process.env.PREVIOUS_DEPLOY_SHA;
            const currentSha = process.env.CURRENT_SHA;
            const prNumbers = new Set();

            if (!previousDeploySha || previousDeploySha === currentSha) {
              core.info('No previous successful deployment range found for failed deployment label');
              return;
            }

            const compareCommits = await github.paginate(
              'GET /repos/{owner}/{repo}/compare/{basehead}',
              {
                owner,
                repo,
                basehead: `${previousDeploySha}...${currentSha}`,
                per_page: 100,
              },
              (response) => response.data.commits || []
            );

            const commitsNeedingLookup = [];
            const prNumberPattern = /\(#(\d+)\)|^Merge pull request #(\d+)/;

            for (const commit of compareCommits) {
              const message = commit.commit?.message || '';
              const match = message.match(prNumberPattern);
              const parsedPr = Number(match?.[1] || match?.[2] || 0);

              if (Number.isInteger(parsedPr) && parsedPr > 0) {
                prNumbers.add(parsedPr);
              } else {
                commitsNeedingLookup.push(commit.sha);
              }
            }

            const chunkSize = 10;
            for (let index = 0; index < commitsNeedingLookup.length; index += chunkSize) {
              const chunk = commitsNeedingLookup.slice(index, index + chunkSize);
              const responses = await Promise.all(
                chunk.map((commitSha) =>
                  github.request('GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls', {
                    owner,
                    repo,
                    commit_sha: commitSha,
                  })
                )
              );

              for (const commitPrs of responses) {
                for (const pr of commitPrs.data) {
                  if (pr.base?.ref === 'main' && pr.merged_at) {
                    prNumbers.add(pr.number);
                  }
                }
              }

              if (index + chunkSize < commitsNeedingLookup.length) {
                await new Promise((resolve) => setTimeout(resolve, 200));
              }
            }

            if (prNumbers.size === 0) {
              core.info('No merged pull requests found to label as non deployed');
              return;
            }

            try {
              await github.request('GET /repos/{owner}/{repo}/labels/{name}', {
                owner,
                repo,
                name: undeployedLabel,
              });
            } catch (error) {
              if (error.status === 404) {
                await github.request('POST /repos/{owner}/{repo}/labels', {
                  owner,
                  repo,
                  name: undeployedLabel,
                  color: 'D73A4A',
                  description: 'PR merged but not yet deployed successfully',
                });
              } else {
                throw error;
              }
            }

            for (const issue_number of prNumbers) {
              await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/labels', {
                owner,
                repo,
                issue_number,
                labels: [undeployedLabel],
              });
            }

            core.info(
              `Applied label ${undeployedLabel} to PRs: ${Array.from(prNumbers)
                .sort((a, b) => a - b)
                .join(', ')}`
            );

      - name: Summarize production deployment
        if: always()
        run: |
          {
            echo "## Production deployment summary"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Drain enabled | ${{ vars.DEPLOY_DRAIN_ENABLED == 'true' }} |"
            echo "| Drain begin | ${{ steps.begin_drain.outcome }} |"
            echo "| Drain wait | ${{ steps.wait_drain.outcome }} |"
            echo "| Drain mark deploying | ${{ steps.mark_drain_deploying.outcome }} |"
            echo "| Drain release | ${{ steps.release_drain.outcome }} |"
            echo "| Last active jobs | ${{ steps.wait_drain.outputs.last_active_jobs || steps.begin_drain.outputs.active_jobs || 'n/a' }} |"
            echo "| Last admissions in progress | ${{ steps.wait_drain.outputs.last_admissions_in_progress || steps.begin_drain.outputs.admissions_in_progress || 'n/a' }} |"
            echo "| Drain wait duration (seconds) | ${{ steps.wait_drain.outputs.waited_seconds || '0' }} |"
            echo "| Image build | ${{ steps.build_image.outcome }} |"
            echo "| SSH deployment | ${{ steps.trigger_deploy.outcome }} |"
            echo "| Version verification | ${{ steps.verify_deploy.outcome }} |"
            echo "| Deployment labels | ${{ steps.label_deployed_prs.outcome }} |"
            echo "| Target version | ${{ steps.version.outputs.version }} |"
            echo "| Run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize deployment failure
        if: >-
          always() && (
            steps.build_image.outcome != 'success' ||
            steps.trigger_deploy.outcome != 'success' ||
            steps.verify_deploy.outcome != 'success' ||
            (vars.DEPLOY_DRAIN_ENABLED == 'true' && (
              steps.begin_drain.outcome != 'success' ||
              steps.wait_drain.outcome != 'success' ||
              steps.mark_drain_deploying.outcome != 'success' ||
              steps.release_drain.outcome != 'success'
            ))
          )
        run: |
          {
            echo "## Production deployment failed"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Repository | ${{ github.repository }} |"
            echo "| Branch | ${{ github.ref_name }} |"
            echo "| Commit | ${{ github.sha }} |"
            echo "| Deployment version | ${{ steps.version.outputs.version }} |"
            echo "| Image build | ${{ steps.build_image.outcome }} |"
            echo "| Drain enabled | ${{ vars.DEPLOY_DRAIN_ENABLED == 'true' }} |"
            echo "| Drain begin | ${{ steps.begin_drain.outcome }} |"
            echo "| Drain wait | ${{ steps.wait_drain.outcome }} |"
            echo "| Drain mark deploying | ${{ steps.mark_drain_deploying.outcome }} |"
            echo "| Drain release | ${{ steps.release_drain.outcome }} |"
            echo "| SSH deployment | ${{ steps.trigger_deploy.outcome }} |"
            echo "| Version verification | ${{ steps.verify_deploy.outcome }} |"
            echo "| Run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
            echo ""
            echo "The deployment job is intentionally failed so GitHub sends the native Actions failure email notification."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify deployment failure
        if: >-
          always() && (
            steps.build_image.outcome != 'success' ||
            steps.trigger_deploy.outcome != 'success' ||
            steps.verify_deploy.outcome != 'success' ||
            (vars.DEPLOY_DRAIN_ENABLED == 'true' && (
              steps.begin_drain.outcome != 'success' ||
              steps.wait_drain.outcome != 'success' ||
              steps.mark_drain_deploying.outcome != 'success' ||
              steps.release_drain.outcome != 'success'
            ))
          )
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          NOTIFY_USERS: ${{ vars.DEPLOY_FAILURE_NOTIFY_USERS || github.repository_owner }}
          FAILURE_LABEL: deployment failed
          DEPLOYMENT_VERSION: ${{ steps.version.outputs.version }}
          IMAGE_BUILD: ${{ steps.build_image.outcome }}
          DRAIN_ENABLED: ${{ vars.DEPLOY_DRAIN_ENABLED == 'true' }}
          DRAIN_BEGIN: ${{ steps.begin_drain.outcome }}
          DRAIN_WAIT: ${{ steps.wait_drain.outcome }}
          DRAIN_MARK: ${{ steps.mark_drain_deploying.outcome }}
          DRAIN_RELEASE: ${{ steps.release_drain.outcome }}
          SSH_DEPLOYMENT: ${{ steps.trigger_deploy.outcome }}
          VERSION_VERIFICATION: ${{ steps.verify_deploy.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const labelName = process.env.FAILURE_LABEL;
            const rawNotifyUsers = process.env.NOTIFY_USERS || '';
            const notifyUsers = rawNotifyUsers
              .split(/[\s,]+/)
              .map((user) => user.trim().replace(/^@/, ''))
              .filter(Boolean);
            const mentions = notifyUsers.map((user) => `@${user}`).join(' ');
            const runUrl = process.env.RUN_URL;
            const title = `Production deployment failed: ${process.env.DEPLOYMENT_VERSION}`;
            const body = [
              mentions ? `${mentions} le déploiement automatique en production a échoué.` : 'Le déploiement automatique en production a échoué.',
              '',
              '| Field | Value |',
              '| --- | --- |',
              `| Repository | ${context.repo.owner}/${context.repo.repo} |`,
              `| Branch | ${context.ref.replace('refs/heads/', '')} |`,
              `| Commit | ${context.sha} |`,
              `| Deployment version | ${process.env.DEPLOYMENT_VERSION} |`,
              `| Image build | ${process.env.IMAGE_BUILD} |`,
              `| Drain enabled | ${process.env.DRAIN_ENABLED} |`,
              `| Drain begin | ${process.env.DRAIN_BEGIN} |`,
              `| Drain wait | ${process.env.DRAIN_WAIT} |`,
              `| Drain mark deploying | ${process.env.DRAIN_MARK} |`,
              `| Drain release | ${process.env.DRAIN_RELEASE} |`,
              `| SSH deployment | ${process.env.SSH_DEPLOYMENT} |`,
              `| Version verification | ${process.env.VERSION_VERIFICATION} |`,
              `| Run | ${runUrl} |`,
            ].join('\n');

            try {
              await github.request('GET /repos/{owner}/{repo}/labels/{name}', {
                owner,
                repo,
                name: labelName,
              });
            } catch (error) {
              if (error.status === 404) {
                await github.request('POST /repos/{owner}/{repo}/labels', {
                  owner,
                  repo,
                  name: labelName,
                  color: 'D73A4A',
                  description: 'Automatic production deployment failed',
                });
              } else {
                throw error;
              }
            }

            const issue = await github.request('POST /repos/{owner}/{repo}/issues', {
              owner,
              repo,
              title,
              body,
              labels: [labelName],
            });

            core.info(`Created deployment failure notification issue: ${issue.data.html_url}`);

      - name: Fail job when deployment failed
        if: >-
          always() && (
            steps.build_image.outcome != 'success' ||
            steps.trigger_deploy.outcome != 'success' ||
            steps.verify_deploy.outcome != 'success' ||
            (vars.DEPLOY_DRAIN_ENABLED == 'true' && (
              steps.begin_drain.outcome != 'success' ||
              steps.wait_drain.outcome != 'success' ||
              steps.mark_drain_deploying.outcome != 'success' ||
              steps.release_drain.outcome != 'success'
            ))
          )
        run: |
          echo "Deployment, drain coordination, drain cleanup, or version verification failed"
          exit 1
