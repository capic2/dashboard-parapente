name: CI - Nx Monorepo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write

jobs:
  main:
    name: main
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      NX_NO_CLOUD: true

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Reuse valid local Nx task results between runs. The Mergify queue
      # validation explicitly skips this cache below.
      - name: 💾 Setup NX Cache
        uses: actions/cache@v6
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 🐍 Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: apps/backend/requirements.txt

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          cd apps/backend && pip install -r requirements.txt

      - name: 💾 Cache Playwright browsers
        id: playwright-cache-main
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: 🎭 Install Playwright
        run: |
          if [ "${{ steps.playwright-cache-main.outputs.cache-hit }}" != "true" ]; then
            pnpm exec playwright install --with-deps chromium
          else
            pnpm exec playwright install-deps chromium
          fi
          python -m playwright install chromium

      - name: 🔍 Check unused code (knip)
        run: pnpm knip

      - name: 🔍 Derive SHAs for affected projects
        if: github.event_name != 'pull_request' || !startsWith(github.event.pull_request.title, 'merge queue:')
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: 'main'

      - name: 🔨 Run full validation for Mergify queue
        if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'merge queue:')
        run: bash .github/scripts/run-full-nx-validation.sh
        env:
          TESTING: true
          BACKEND_DATABASE_URL: sqlite:///./test.db
          BACKEND_WEATHERAPI_KEY: test_key
          BACKEND_METEOBLUE_API_KEY: test_key
          BACKEND_JWT_SECRET: ci-test-secret-not-for-production
          VITE_CESIUM_ION_TOKEN: ${{ secrets.VITE_CESIUM_ION_TOKEN }}

      - name: 🔨 Run affected validation for pull requests and pushes
        if: github.event_name != 'pull_request' || !startsWith(github.event.pull_request.title, 'merge queue:')
        run: |
          affected_projects=$(pnpm exec nx show projects --affected --json)
          affected_count=0
          if [[ -n "$affected_projects" ]]; then
            affected_count=$(node -e 'console.log(JSON.parse(process.argv[1]).length)' "$affected_projects")
          fi

          if [[ "$affected_count" == "0" ]]; then
            echo "Nx found no affected projects; running full uncached validation as a safety net."
            bash .github/scripts/run-full-nx-validation.sh
          else
            pnpm exec nx affected -t build,lint,type-check,test --parallel=5 --exclude=e2e
          fi
        env:
          TESTING: true
          BACKEND_DATABASE_URL: sqlite:///./test.db
          BACKEND_WEATHERAPI_KEY: test_key
          BACKEND_METEOBLUE_API_KEY: test_key
          BACKEND_JWT_SECRET: ci-test-secret-not-for-production
          VITE_CESIUM_ION_TOKEN: ${{ secrets.VITE_CESIUM_ION_TOKEN }}

      - name: 📊 Upload frontend coverage
        if: always() && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/apps/frontend/lcov.info
          flags: frontend
          name: frontend-coverage
        continue-on-error: true

      - name: 📊 Upload backend coverage
        if: always() && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/apps/backend/coverage.xml
          flags: backend
          name: backend-coverage
        continue-on-error: true

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    env:
      NODE_OPTIONS: --preserve-symlinks

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      # NX Local Cache for E2E: same strategy as main job
      - name: 💾 Setup NX Cache (local fallback)
        uses: actions/cache@v6
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 🐍 Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: apps/backend/requirements.txt

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          cd apps/backend && pip install -r requirements.txt

      - name: 💾 Cache Playwright browsers
        id: playwright-cache-e2e
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: 🎭 Install Playwright
        run: |
          if [ "${{ steps.playwright-cache-e2e.outputs.cache-hit }}" != "true" ]; then
            pnpm exec playwright install --with-deps chromium
          else
            pnpm exec playwright install-deps chromium
          fi
          python -m playwright install chromium

      # Configure NX Cloud for E2E: same logic as main job
      - name: 🎛️ Configure NX Cloud execution
        run: |
          LABELS=$(gh pr view ${{ github.event.pull_request.number }} --json labels --jq '.labels[].name' 2>/dev/null || echo "")
          if echo "$LABELS" | grep -qx "automerge"; then
            echo "IS_AUTOMERGE=true" >> $GITHUB_ENV
            echo "NX_NO_CLOUD=true" >> $GITHUB_ENV
            echo "Automerge: NX Cloud disabled for an uncached E2E validation"
          elif echo "$LABELS" | grep -qx "skip-nx-cloud"; then
            echo "IS_AUTOMERGE=false" >> $GITHUB_ENV
            echo "NX_NO_CLOUD=true" >> $GITHUB_ENV
            echo "NX Cloud DISABLED (skip-nx-cloud label)"
          else
            echo "IS_AUTOMERGE=false" >> $GITHUB_ENV
            echo "NX_NO_CLOUD=false" >> $GITHUB_ENV
            echo "NX Cloud ENABLED"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 🧪 Run E2E tests
        id: e2e
        continue-on-error: true
        run: |
          set -o pipefail
          NX_ARGS=()
          if [[ "$IS_AUTOMERGE" == "true" ]]; then
            NX_ARGS+=(--skip-nx-cache)
          fi
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 pnpm exec nx e2e e2e --configuration=ci --skipInstall "${NX_ARGS[@]}" 2>&1 | tee /tmp/e2e.log
        env:
          DEBUG: pw:webserver
          ENVIRONMENT: test
          TESTING: false
          BACKEND_WEATHERAPI_KEY: test_key
          BACKEND_METEOBLUE_API_KEY: test_key
          BACKEND_JWT_SECRET: ci-test-secret-not-for-production
          VITE_CESIUM_ION_TOKEN: e2e-ci-placeholder-token

      - name: 🔄 Retry E2E with local cache (if NX Cloud exhausted)
        if: steps.e2e.outcome == 'failure'
        run: |
          if grep -qE "(Workspace is unable to be authorized|exceeding the FREE plan|Workspace is disabled)" /tmp/e2e.log; then
            echo "NX Cloud credits exhausted - retrying with local cache"
            gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels \
              -f "labels[]=nx-cloud-no-credit" -f "labels[]=skip-nx-cloud" || true
            NX_NO_CLOUD=true PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 pnpm exec nx e2e e2e --configuration=ci --skipInstall
          else
            echo "E2E failed for non-NX-Cloud reason"
            exit 1
          fi
        env:
          DEBUG: pw:webserver
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: test
          TESTING: false
          BACKEND_WEATHERAPI_KEY: test_key
          BACKEND_METEOBLUE_API_KEY: test_key
          BACKEND_JWT_SECRET: ci-test-secret-not-for-production
          VITE_CESIUM_ION_TOKEN: e2e-ci-placeholder-token

      - name: 📤 Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: apps/e2e/test-results
          retention-days: 7
