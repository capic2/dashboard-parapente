name: Preview PR temporaire

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: temporary-pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Fetch the latest demo database backup
        env:
          PREVIEW_SEED_HOST: ${{ secrets.SSH_HOST }}
          PREVIEW_SEED_USER: ${{ secrets.SSH_USER }}
          PREVIEW_SEED_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          PREVIEW_SEED_PORT: ${{ secrets.SSH_PORT }}
          PREVIEW_SEED_DIRECTORY: /media/nas/DS211_Synology_2/parapente/database-backups
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends sshpass
          [ -n "$PREVIEW_SEED_HOST" ] && [ -n "$PREVIEW_SEED_USER" ] && [ -n "$PREVIEW_SEED_PASSWORD" ] && [ -n "$PREVIEW_SEED_DIRECTORY" ]
          case "$PREVIEW_SEED_PORT" in ''|*[!0-9]*) echo 'PREVIEW_SEED_SSH_PORT must be numeric'; exit 1 ;; esac
          mkdir -p ~/.ssh
          ssh-keyscan -p "$PREVIEW_SEED_PORT" -H "$PREVIEW_SEED_HOST" >> ~/.ssh/known_hosts
          seed_database=$(sshpass -p "$PREVIEW_SEED_PASSWORD" ssh -p "$PREVIEW_SEED_PORT" -o StrictHostKeyChecking=yes "$PREVIEW_SEED_USER@$PREVIEW_SEED_HOST" "find '$PREVIEW_SEED_DIRECTORY' -maxdepth 1 -type f -name 'dashboard-*.sqlite3.gz' -printf '%T@ %f\\n' | sort -nr | head -n 1 | cut -d' ' -f2-")
          case "$seed_database" in dashboard-*.sqlite3.gz) ;; *) echo 'No valid demo backup found'; exit 1 ;; esac
          mkdir -p .preview-seed
          sshpass -p "$PREVIEW_SEED_PASSWORD" scp -P "$PREVIEW_SEED_PORT" -o StrictHostKeyChecking=yes "$PREVIEW_SEED_USER@$PREVIEW_SEED_HOST:$PREVIEW_SEED_DIRECTORY/$seed_database" .preview-seed/dashboard.sqlite3.gz
          gzip --test .preview-seed/dashboard.sqlite3.gz

      - name: Build and start the preview
        id: start
        env:
          VITE_CESIUM_ION_TOKEN: ${{ secrets.VITE_CESIUM_ION_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          PREVIEW_JWT_SECRET=$(openssl rand -hex 32)
          cleanup() {
            docker rm --force dashboard-preview-tunnel dashboard-preview-app 2>/dev/null || true
            docker network rm preview-network 2>/dev/null || true
          }
          trap cleanup EXIT
          docker build --build-arg "VITE_CESIUM_ION_TOKEN=$VITE_CESIUM_ION_TOKEN" --build-arg "BACKEND_DEPLOY_VERSION=pr-$PR_NUMBER-$PR_SHA" --build-context gopro-overlay-src="${{ vars.GOPRO_OVERLAY_BUILD_CONTEXT || 'https://github.com/capic2/gopro-dashboard-overlay.git#7cbf7be6499ee3cc3c968f0c3dedc7fa62d893c7' }}" --tag dashboard-preview:$PR_SHA .
          docker network create preview-network
          docker run --detach --name dashboard-preview-app --network preview-network --env ENVIRONMENT=preview --env BACKEND_DATABASE_URL=sqlite:////app/db/dashboard.db --env DATABASE_URL=sqlite:////app/db/dashboard.db --env BACKEND_WEATHERAPI_KEY=preview-placeholder --env BACKEND_USE_FAKE_REDIS=true --env BACKEND_JOB_QUEUE_BACKEND=memory --env BACKEND_SCHEDULER_ENABLED=false --env BACKEND_INTERVALS_ICU_SYNC_ENABLED=false --env BACKEND_JWT_SECRET="$PREVIEW_JWT_SECRET" --env BACKEND_ADMIN_EMAIL=preview@example.invalid --env BACKEND_ADMIN_PASSWORD=preview-only-password --env BACKEND_METRICS_TOKEN=preview-only-token --env BACKEND_LOG_FILE=/tmp/dashboard-preview.log --env BACKEND_VERSION_STATE_FILE=/tmp/version.json --env BACKEND_VIDEO_EXPORT_DIR=/tmp/video-exports --env BACKEND_VIDEO_TEMP_IMAGES_DIR=/tmp/video-temp-images --env BACKEND_EMAGRAM_CACHE_DIR=/tmp/emagram-cache --volume "$PWD/.preview-seed:/app/db" dashboard-preview:$PR_SHA
          for attempt in $(seq 1 30); do
            if docker run --rm --network preview-network curlimages/curl:8.16.0 --fail --silent http://dashboard-preview-app:8001/health >/dev/null; then break; fi
            sleep 5
            [ "$attempt" -lt 30 ] || { docker logs dashboard-preview-app; exit 1; }
          done
          docker run --detach --name dashboard-preview-tunnel --network preview-network cloudflare/cloudflared:latest tunnel --url http://dashboard-preview-app:8001
          for attempt in $(seq 1 30); do
            preview_url=$(docker logs dashboard-preview-tunnel 2>&1 | grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' | head -n 1 || true)
            if [ -n "$preview_url" ]; then echo "url=$preview_url" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 2
          done
          docker logs dashboard-preview-tunnel
          exit 1

      - name: Post the preview link on the pull request
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.start.outputs.url }}
        with:
          script: |
            const marker = '<!-- dashboard-parapente-temporary-preview -->';
            const body = `${marker}\n🚀 Preview temporaire : ${process.env.PREVIEW_URL}\n\nCette URL reste disponible au plus 60 minutes. La base est une copie isolée de la dernière sauvegarde de démo.`;
            const { data: comments } = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number });
            const previous = comments.find((comment) => comment.user.type === 'Bot' && comment.body.includes(marker));
            if (previous) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: previous.id, body });
            else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });

      - name: Keep the preview available
        if: success()
        run: sleep 2700
